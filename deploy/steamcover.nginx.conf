server {
    listen 80;
    listen [::]:80;
    server_name steamcover.alang.love;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/steamcover-acme;
    }

    location / {
        return 301 https://steamcover.alang.love$request_uri;
    }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name steamcover.alang.love;

    ssl_certificate /etc/letsencrypt/live/steamcover.alang.love/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/steamcover.alang.love/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    access_log /var/log/nginx/steamcover.access.log;
    error_log /var/log/nginx/steamcover.error.log;

    location ^~ /_next/static/ {
        alias /opt/steamcover/current/.next/static/;
        access_log off;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
        proxy_pass http://127.0.0.1:3017;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection "";
        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
        proxy_buffering off;
    }
}
